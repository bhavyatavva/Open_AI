name: Verify release
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test-only, POSTGRES_USER: lessonly, POSTGRES_DB: lessonly_test}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U lessonly" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lessonly:test-only@localhost:5432/lessonly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: npm ci && npm run build && npm test && npm audit --omit=dev
        working-directory: web
      - run: docker build -t lessonly:test .
